<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CivicFix Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#f9f9ff;color:#43474f;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;border-radius:16px;padding:32px;width:100%;max-width:400px;box-shadow:0 10px 15px -3px #0000001a}
h1{color:#00254b;font-size:22px;margin-bottom:4px}
.sub{font-size:14px;margin-bottom:24px}
label{display:block;font-size:12px;font-weight:700;color:#00254b;margin:16px 0 4px}
input{width:100%;padding:12px;border:1px solid #c3c6d0;border-radius:8px;font:14px Inter,system-ui,sans-serif;background:#f9f9ff}
input:focus{outline:2px solid #0051d5;border-color:#0051d5}
button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:8px;background:#0051d5;color:#fff;font:600 14px Inter,system-ui,sans-serif;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{margin-top:12px;font-size:13px;font-weight:600;text-align:center;min-height:18px;color:#ba1a1a}
#dash{display:none;text-align:center}
#dash h1{margin-bottom:8px}
.out{background:#00254b;margin-top:24px}
</style>
</head>
<body>

<div class="card" id="loginBox">
  <h1>CivicFix Admin</h1>
  <p class="sub">Sign in with your staff account.</p>
  <form id="loginForm" novalidate>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="btn">Sign in</button>
    <div class="msg" id="msg" role="status"></div>
  </form>
</div>

<div class="card" id="dash">
  <h1 id="welcome">Welcome</h1>
  <p class="sub">Admin dashboard. Complaint management comes in the next step.</p>
  <button class="out" id="logout">Sign out</button>
</div>

<script>
var SUPABASE_URL = "https://qtqjaylpmbpuokbfjcye.supabase.co";
var SUPABASE_KEY = "sb_publishable_uc5JLkQwqtbvAh1VDx3Vtw_Hd4NIhg8";

var loginBox = document.getElementById("loginBox"),
    dash = document.getElementById("dash"),
    msg = document.getElementById("msg"),
    btn = document.getElementById("btn"),
    form = document.getElementById("loginForm");

function showLogin(text){
  dash.style.display = "none";
  loginBox.style.display = "block";
  msg.textContent = text || "";
  btn.disabled = false; btn.textContent = "Sign in";
}

function showDashboard(staff){
  loginBox.style.display = "none";
  dash.style.display = "block";
  document.getElementById("welcome").textContent = "Welcome, " + (staff.full_name || "Admin");
}

// Sign in with email and password
async function signIn(email, password){
  var res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
    method: "POST",
    headers: { "Content-Type": "application/json", "apikey": SUPABASE_KEY },
    body: JSON.stringify({ email: email, password: password })
  });
  if (!res.ok) throw new Error("Invalid email or password.");
  var data = await res.json();
  sessionStorage.setItem("cf_token", data.access_token);
  return data.access_token;
}

// Confirm this user is an admin staff member
async function getStaff(token){
  var res = await fetch(SUPABASE_URL + "/rest/v1/staff?select=role,full_name", {
    headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + token }
  });
  if (!res.ok) throw new Error("Could not verify staff access.");
  var rows = await res.json();
  if (!rows.length || rows[0].role !== "admin") throw new Error("This account does not have admin access.");
  return rows[0];
}

function signOut(){
  sessionStorage.removeItem("cf_token");
  showLogin("You have been signed out.");
}

form.addEventListener("submit", async function(e){
  e.preventDefault();
  var email = document.getElementById("email").value.trim(),
      password = document.getElementById("password").value;
  if (!email || !password){ msg.textContent = "Please enter email and password."; return; }
  btn.disabled = true; btn.textContent = "Signing in…"; msg.textContent = "";
  try {
    var token = await signIn(email, password);
    var staff = await getStaff(token);
    showDashboard(staff);
  } catch (err) {
    sessionStorage.removeItem("cf_token");
    showLogin(err.message);
  }
});

document.getElementById("logout").addEventListener("click", signOut);

// Stay signed in while the tab is open
(async function init(){
  var token = sessionStorage.getItem("cf_token");
  if (!token) return showLogin();
  try { showDashboard(await getStaff(token)); }
  catch (err) { showLogin("Please sign in again."); }
})();
</script>
</body>
</html>
